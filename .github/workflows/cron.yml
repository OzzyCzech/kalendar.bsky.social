name: Post to Bluesky

# Triggered externally (cron-job.org) via the workflow_dispatch REST API.
# GitHub's own `schedule` event was delayed by 6-11 hours for days on end,
# so it is deliberately not used here.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the post and print it, but do not publish"
        type: boolean
        default: false

concurrency:
  group: post-to-bluesky
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Submit new post
        run: node --no-warnings src/daily.js
        env:
          CALENDAR_APP_HANDLE: "kalendar.bsky.social"
          CALENDAR_APP_PASSWORD: ${{ secrets.CALENDAR_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
